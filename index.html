<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOYU·时钟</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.7.8/dist/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.7.8/theme-chalk/dark/css-vars.css">
<link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <header>
    <h1>MOYU·时钟</h1>
    <div class="date" id="todayDate"></div>
  </header>

  <div class="timer idle" id="timer">00:00:00</div>
  <div class="mode-label" id="modeLabel">还没开始，点下面按钮</div>

  <div class="btn-row">
    <button class="btn idle" id="mainBtn">开始专注</button>
    <button class="btn-ghost" id="pauseBtn" style="display:none">暂停</button>
  </div>

  <div class="stats">
    <div class="stat-item">
      <div class="stat-value" style="color:#2ee6a8" id="todayFocus">0m</div>
      <div class="stat-label">今日专注</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" style="color:#ff7a59" id="todaySlack">0m</div>
      <div class="stat-label">今日moyu</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="slackRate" style="color:#ccc">--</div>
      <div class="stat-label">moyu率</div>
    </div>
  </div>

  <div id="mockBanner" class="mock-banner" style="display:none">
    <span>示例数据预览中 · 不保存、不影响真实数据，刷新页面自动恢复</span>
    <button id="exitMockBtn">退出预览</button>
  </div>

  <div class="cards">
    <div class="card">
      <h3>最近 7 天</h3>
      <div id="historyList" class="grow"></div>
    </div>
    <div class="card">
      <h3>今日曲线</h3>
      <div id="chart" class="grow"></div>
    </div>
    <div class="card">
      <h3>今日时间线</h3>
      <div id="timeline" class="grow"></div>
    </div>
  </div>

  <div class="tools">
    <button class="tool-btn" id="notifyBtn">开启提醒</button>
    <button class="tool-btn" id="reportBtn">复制今日战绩</button>
    <button class="tool-btn" id="weekBtn">复制本周战报</button>
    <button class="tool-btn" id="exportBtn">导出数据</button>
    <button class="tool-btn" id="mockBtn">填充示例数据</button>
    <button class="tool-btn" id="resetBtn">重置今日</button>
    <button class="tool-btn" id="worktimeBtn">工作时间</button>
    <button class="tool-btn" id="clearAllBtn">清空全部数据</button>
  </div>

  <div class="hint">
    <span id="worktimeHint" class="wt-hint"></span>
    <span id="worktimeHintSep" style="display:none">｜</span>
    <span>空格 = 开始 / 切换专注·moyu &nbsp;·&nbsp; Esc = 暂停 / 继续</span>
  </div>
  <div class="toast" id="toast"></div>

  <!-- 工作时间设置（Element Plus 弹窗挂载点） -->
  <div id="worktime-app">
    <el-dialog v-model="visible" title="工作时间设置" width="460px" :close-on-click-modal="false">
      <div class="wt-row" v-for="(p, key) in form" :key="key">
        <span class="wt-name">{{ names[key] }}</span>
        <el-time-picker
          v-model="p.range"
          is-range
          format="HH:mm"
          value-format="HH:mm"
          range-separator="至"
          start-placeholder="开始时间"
          end-placeholder="结束时间"
          :disabled="!p.enabled"
          style="flex:1">
        </el-time-picker>
        <el-switch v-model="p.enabled"></el-switch>
      </div>
      <div class="wt-tip">开启的时段决定「今日曲线」的横轴范围，时段之间的间隙（如午休）会在图上显示为暗色区域。</div>
      <template #footer>
        <el-button @click="visible = false">取消</el-button>
        <el-button type="primary" @click="save">保存</el-button>
      </template>
    </el-dialog>
  </div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.4.31/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus@2.7.8/dist/index.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus@2.7.8/dist/locale/zh-cn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="src/js/app.js"></script>
</body>
</html>
